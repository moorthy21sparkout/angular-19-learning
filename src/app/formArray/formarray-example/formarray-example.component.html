<form [formGroup]="formArray">
    <div formArrayName="emailList">
        <div *ngFor="let email of emailList.controls; let i=index">
            <input [formControlName]="i">
            <button type="button" (click)="removeEmail(i)">
                Remove
            </button>
        </div>
        <button type="button" (click)="addEmail()">
            Add Email
        </button>
    </div>
    <div formArrayName="mobileList">
        <div *ngFor="let mobile of mobileList.controls; let i=index">
            <input [formControlName]="i">
            <button type="button" (click)="removeMobileList(i)">
                Remove
            </button>
        </div>
        <button type="button" (click)="addMobile()">
            Add Mobile
        </button>
    </div>
</form>
